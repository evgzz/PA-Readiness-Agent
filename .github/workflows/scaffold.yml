name: Contracts and scaffold checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Contracts, packaging and structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Check scaffold
        run: python3 scripts/check_scaffold.py
      - name: Contract boundary tests
        run: python3 scripts/run_contract_tests.py
      - name: Install package
        run: python3 -m pip install --no-deps .
      - name: Validate installed configuration command
        working-directory: /tmp
        run: pa-contracts runtime-config "${{ github.workspace }}/recipes/runtime-config.example.json"
