[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-readiness-agent"
version = "0.1.0"
description = "PA Readiness v1 contracts and independent component foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pa-contracts = "pa_contracts.cli:main"

[tool.setuptools]
packages = ["pa_contracts", "pa_agent", "pa_harness", "pa_evals", "pa_models", "pa_tools", "pa_runtimes", "pa_telemetry", "pa_governance"]
include-package-data = false

[tool.setuptools.package-dir]
pa_contracts = "contracts/src/pa_contracts"
pa_agent = "agent/src/pa_agent"
pa_harness = "harness/src/pa_harness"
pa_evals = "evals/src/pa_evals"
pa_models = "model_adapters/src/pa_models"
pa_tools = "tool_adapters/src/pa_tools"
pa_runtimes = "runtime_adapters/src/pa_runtimes"
pa_telemetry = "telemetry/src/pa_telemetry"
pa_governance = "governance/src/pa_governance"

[tool.setuptools.package-data]
pa_contracts = ["resources/*.json"]
